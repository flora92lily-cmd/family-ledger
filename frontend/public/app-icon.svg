<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle top-left glow -->
  <ellipse cx="180" cy="120" rx="220" ry="130" fill="white" opacity="0.07"/>

  <!-- Chimney -->
  <rect x="308" y="118" width="40" height="88" rx="6" fill="white"/>

  <!-- Roof -->
  <path d="M256 78 L444 258 H68 Z" fill="white"/>

  <!-- House body -->
  <rect x="96" y="252" width="320" height="200" rx="10" fill="white"/>

  <!-- Left window frame -->
  <rect x="118" y="274" width="100" height="82" rx="10" fill="#7C3AED" opacity="0.12"/>

  <!-- Bar chart: 3 ascending bars -->
  <rect x="136" y="324" width="18" height="24" rx="4" fill="url(#barGrad)"/>
  <rect x="163" y="308" width="18" height="40" rx="4" fill="url(#barGrad)"/>
  <rect x="190" y="292" width="18" height="56" rx="4" fill="url(#barGrad)"/>

  <!-- Tiny trend line connecting bar tops -->
  <polyline points="145,322 172,306 199,290" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Right window frame -->
  <rect x="294" y="274" width="100" height="82" rx="10" fill="#7C3AED" opacity="0.12"/>

  <!-- Coin (outer circle) -->
  <circle cx="344" cy="315" r="30" fill="none" stroke="white" stroke-width="6" opacity="0.9"/>

  <!-- Coin inner detail: two horizontal lines like ¥ strokes -->
  <line x1="327" y1="308" x2="361" y2="308" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="327" y1="320" x2="361" y2="320" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Coin inner vertical line -->
  <line x1="344" y1="295" x2="344" y2="335" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Door (rounded arch) -->
  <path d="M221 452 L221 348 A35 35 0 0 1 291 348 L291 452 Z"
        fill="#7C3AED" opacity="0.18"/>
  <path d="M221 452 L221 348 A35 35 0 0 1 291 348 L291 452 Z"
        fill="none" stroke="white" stroke-width="3.5" opacity="0.5"/>

  <!-- Door knob -->
  <circle cx="277" cy="405" r="6" fill="white" opacity="0.6"/>

</svg>
