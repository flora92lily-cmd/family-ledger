services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-ledger
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL=sqlite+aiosqlite:////data/family_ledger.db
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    container_name: family-ledger-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HOST_PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
